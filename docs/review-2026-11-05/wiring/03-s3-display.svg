<text x="1015" y="729" class="small" text-anchor="start">T_CS</text>
<path d="M440,741 L1010,741" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="741" r="6" fill="#3263ac"/>
<circle cx="1010" cy="741" r="6" fill="#3263ac"/>
<text x="90" y="791" class="small" text-anchor="start">GPIO4</text>
<text x="1015" y="791" class="small" text-anchor="start">LED: условно, см. ниже</text>
<path d="M440,803 L1010,803" stroke="#7b46c5" stroke-width="5" fill="none"/>
<circle cx="440" cy="803" r="6" fill="#7b46c5"/>
<circle cx="1010" cy="803" r="6" fill="#7b46c5"/>
<text x="65" y="935" class="small" text-anchor="start">T_IRQ и TFT SDO не подключены. Общий SPI для дисплея и тача; разные CS.</text>
<text x="65" y="980" class="small" text-anchor="start">GPIO4 → LED проверялось на этом модуле; ток входа не измерен. Для другого TFT нужен драйвер.</text>
<text x="65" y="1018" class="small" text-anchor="start">Нельзя одновременно соединять LED с GPIO4 и 3V3. Старые схемы TX17/RX16 здесь не применять.</text>
<text x="55" y="1060" class="small" text-anchor="start">MiniDash · 2026-11-05 · Контакты показаны по именам, не по расположению на плате.</text>
</svg>