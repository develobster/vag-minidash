<text x="1015" y="667" class="small" text-anchor="start">T_DO (не TFT SDO)</text>
<path d="M440,679 L1010,679" stroke="#007ea7" stroke-width="5" fill="none"/>
<circle cx="440" cy="679" r="6" fill="#007ea7"/>
<circle cx="1010" cy="679" r="6" fill="#007ea7"/>
