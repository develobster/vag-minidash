<text x="90" y="543" class="small" text-anchor="start">GPIO8</text>
<text x="1015" y="543" class="small" text-anchor="start">DC / RS</text>
<path d="M440,555 L1010,555" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="555" r="6" fill="#3263ac"/>
<circle cx="1010" cy="555" r="6" fill="#3263ac"/>
<text x="90" y="605" class="small" text-anchor="start">GPIO9</text>
<text x="1015" y="605" class="small" text-anchor="start">RESET / RST</text>
<path d="M440,617 L1010,617" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="617" r="6" fill="#3263ac"/>
<circle cx="1010" cy="617" r="6" fill="#3263ac"/>
