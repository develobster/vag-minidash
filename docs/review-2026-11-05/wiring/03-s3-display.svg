<text x="55" y="65" class="title" text-anchor="start">ESP32-S3 → отдельный TFT 2.4″ + XPT2046</text>
<text x="55" y="110" class="sub" text-anchor="start">Профиль ST7789, 320×240 · GPIO из sdkconfig.defaults · существующий прототип</text>
<rect x="60" y="155" width="420" height="745" rx="18" class="box"/>
<text x="80" y="197" class="label" text-anchor="start">ESP32-S3 2025-V1.4</text>
<rect x="990" y="155" width="550" height="745" rx="18" class="box"/>
<text x="1010" y="197" class="label" text-anchor="start">TFT SPI V1.3 / XPT2046</text>
<text x="90" y="233" class="small" text-anchor="start">3V3</text>
<text x="1015" y="233" class="small" text-anchor="start">VCC</text>
<path d="M440,245 L1010,245" stroke="#d77511" stroke-width="5" fill="none"/>
<circle cx="440" cy="245" r="6" fill="#d77511"/>
<circle cx="1010" cy="245" r="6" fill="#d77511"/>
<text x="90" y="295" class="small" text-anchor="start">GND</text>
<text x="1015" y="295" class="small" text-anchor="start">GND</text>
<path d="M440,307 L1010,307" stroke="#354457" stroke-width="5" fill="none"/>
<circle cx="440" cy="307" r="6" fill="#354457"/>
<circle cx="1010" cy="307" r="6" fill="#354457"/>
<text x="90" y="357" class="small" text-anchor="start">GPIO12</text>
<text x="1015" y="357" class="small" text-anchor="start">SCK + T_CLK</text>
<path d="M440,369 L1010,369" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="369" r="6" fill="#3263ac"/>
<circle cx="1010" cy="369" r="6" fill="#3263ac"/>
<text x="90" y="419" class="small" text-anchor="start">GPIO11</text>
<text x="1015" y="419" class="small" text-anchor="start">SDI/MOSI + T_DIN</text>
<path d="M440,431 L1010,431" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="431" r="6" fill="#3263ac"/>
<circle cx="1010" cy="431" r="6" fill="#3263ac"/>
<text x="90" y="481" class="small" text-anchor="start">GPIO10</text>
<text x="1015" y="481" class="small" text-anchor="start">CS (дисплей)</text>
<path d="M440,493 L1010,493" stroke="#3263ac" stroke-width="5" fill="none"/>
<circle cx="440" cy="493" r="6" fill="#3263ac"/>
