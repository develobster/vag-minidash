<text x="1180" y="490" class="small" text-anchor="start">GPIO: TBD</text>
<text x="80" y="930" class="small" text-anchor="start">Есть переносимое C-ядро, но нет linked firmware, драйвера OLED и подтверждённого RAM/Flash fit.</text>
<text x="80" y="980" class="small" text-anchor="start">Корпуса Lite в комплекте - только механические концепты. Не переносить GPIO от S3 или CYD.</text>
<text x="55" y="1060" class="small" text-anchor="start">MiniDash · 2026-11-05 · Контакты показаны по именам, не по расположению на плате.</text>
